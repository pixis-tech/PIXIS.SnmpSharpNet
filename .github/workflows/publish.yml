name: Publish package

on:
  workflow_dispatch:

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          source-url: https://nuget.pkg.github.com/pixis-tech/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: dotnet restore SnmpSharpNet.sln
      - run: dotnet build SnmpSharpNet.sln --configuration Release --no-restore
      - run: dotnet pack SnmpSharpNet.csproj --configuration Release --no-build --no-restore --output ./artifacts
      - run: dotnet nuget push ./artifacts/*.nupkg --source https://nuget.pkg.github.com/pixis-tech/index.json
